<!doctype html>
<html lang="en">
<head>
{{template "style"}}
<title>{{.Title}} | Slimepay</title>
</head>
<body>
<main>
  {{template "brand"}}

  <section class="done">
    {{if .W}}<div class="badge"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg></div>
    {{else}}<div class="badge red"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg></div>{{end}}
    <h1>{{.Title}}</h1>
    <p class="msg">{{.Message}}</p>

    {{with .W}}
    <dl class="summary">
      <div><dt>Amount to Send</dt><dd>{{.AmountIn}} {{$.Asset}}</dd></div>
      <div><dt>Amount to Receive</dt><dd>NGN {{.AmountOut}}</dd></div>
      <div><dt>Recipient</dt><dd>{{.AccountName}}</dd></div>
    </dl>
    {{end}}
  </section>
</main>
</body>
</html>
