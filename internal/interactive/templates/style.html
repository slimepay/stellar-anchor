{{define "style"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>
  :root {
    --bg: #f2f3f7; --card: #ffffff; --ink: #0b1220; --muted: #667085; --line: rgba(15, 23, 42, .08);
    --field: #f4f5f8; --accent: #2563eb; --accent-2: #7c3aed; --good: #16a34a; --bad: #dc2626;
    --hero-1: #0b1638; --hero-2: #1e2a78; --hero-3: #4c1d95; --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #05070d; --card: #0f1420; --ink: #eef2ff; --muted: #94a3b8; --line: rgba(148, 163, 184, .14); --field: #161c2b; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  main { max-width: 460px; margin: 0 auto; padding: 16px 16px 120px; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 2px 16px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
  .brand svg { width: 26px; height: 26px; }
  .pills { display: flex; gap: 6px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--card); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; box-shadow: 0 0 0 3px rgba(245, 158, 11, .18); }
  .pill svg { width: 13px; height: 13px; }

  .hero { position: relative; overflow: hidden; border-radius: 24px; padding: 20px; color: #fff;
    background: radial-gradient(120% 120% at 100% 0%, var(--hero-3) 0%, transparent 55%), linear-gradient(135deg, var(--hero-1) 0%, var(--hero-2) 100%);
    box-shadow: 0 20px 40px -24px rgba(30, 42, 120, .8); }
  .hero::after { content: ""; position: absolute; inset: auto -40px -60px auto; width: 180px; height: 180px; border-radius: 50%;
    background: radial-gradient(circle, rgba(56, 189, 248, .35), transparent 65%); }
  .hero h1 { margin: 0; font-size: 21px; line-height: 1.25; letter-spacing: -.02em; }
  .hero .sub { margin: 4px 0 18px; color: rgba(255, 255, 255, .72); font-size: 13px; }
  .route { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
  .leg { padding: 12px; border-radius: 16px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .12); backdrop-filter: blur(8px); }
  .leg .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: rgba(255, 255, 255, .6); }
  .leg .v { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-weight: 700; font-size: 16px; }
  .coin { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-size: 11px; font-weight: 800; color: #fff; flex: none; }
  .coin.usdc { background: #2775ca; } .coin.xlm { background: #111827; border: 1px solid rgba(255, 255, 255, .3); } .coin.ngn { background: #16a34a; }
  .arrow { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 255, 255, .14); }
  .arrow svg { width: 16px; height: 16px; }
  .rate { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; margin-top: 14px; font-size: 12.5px; color: rgba(255, 255, 255, .75); }
  .rate b { color: #fff; font-weight: 600; }

  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 18px 2px 6px; }
  .steps div { font-size: 11px; color: var(--muted); }
  .steps div::before { content: ""; display: block; height: 4px; border-radius: 4px; margin-bottom: 6px; background: var(--line); }
  .steps .on { color: var(--ink); font-weight: 600; }
  .steps .on::before { background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

  h2 { display: flex; align-items: center; gap: 8px; margin: 22px 4px 8px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  h2 svg { width: 15px; height: 15px; }
  p { margin: 0 0 12px; color: var(--muted); }
  .card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); padding: 4px 14px; }
  .field { padding: 10px 0; }
  .field + .field { border-top: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
  input, select { width: 100%; height: 44px; padding: 0 12px; font: inherit; font-size: 16px; color: var(--ink); background: var(--field); border: 1px solid transparent; border-radius: 12px; appearance: none; -webkit-appearance: none; transition: border-color .15s, box-shadow .15s; }
  select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 19px, calc(100% - 13px) 19px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(37, 99, 235, .15); }
  .amount { position: relative; }
  .amount input { height: 56px; font-size: 26px; font-weight: 700; letter-spacing: -.02em; padding-right: 96px; }
  .amount .unit { position: absolute; right: 10px; bottom: 21px; display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 5px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-weight: 700; font-size: 13px; }
  .amount .unit .coin { width: 20px; height: 20px; font-size: 9px; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 6px 4px 0; }
  .error { background: rgba(220, 38, 38, .08); color: var(--bad); border: 1px solid rgba(220, 38, 38, .2); padding: 12px 14px; border-radius: 14px; margin: 16px 0 0; font-weight: 500; }

  .trust { display: grid; gap: 10px; margin: 20px 4px 0; }
  .trust div { display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; color: var(--muted); }
  .trust svg { width: 16px; height: 16px; flex: none; margin-top: 1px; color: var(--good); }

  .cta { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 60%, transparent); }
  .cta-inner { max-width: 460px; margin: 0 auto; }
  button { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; font: inherit; font-size: 16px; font-weight: 700; color: #fff; border: 0; border-radius: 16px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%); box-shadow: 0 12px 24px -12px rgba(76, 29, 149, .7); }
  button svg { width: 18px; height: 18px; }
  .fine { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 8px; }

  .done { text-align: center; padding: 8px 4px 4px; }
  .badge { display: grid; place-items: center; width: 64px; height: 64px; margin: 8px auto 14px; border-radius: 50%; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 16px 30px -14px rgba(76, 29, 149, .8); }
  .badge svg { width: 30px; height: 30px; }
  .done h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: -.02em; }
  .done p { max-width: 34ch; margin: 0 auto 18px; }
  dl { margin: 0; }
  dl div { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; }
  dl div + div { border-top: 1px solid var(--line); }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 600; text-align: right; }
  .timeline { margin: 20px 4px 0; display: grid; gap: 14px; }
  .timeline > div { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; font-size: 13.5px; }
  .timeline span { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; font-size: 12px; font-weight: 700; background: var(--field); color: var(--muted); }
  .timeline .now span { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
  .timeline p { margin: 3px 0 0; color: var(--ink); }
  .timeline b { display: block; }
  .timeline small { color: var(--muted); }
</style>
{{end}}

{{define "brand"}}
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="sp" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/></linearGradient></defs><rect x="2" y="2" width="28" height="28" rx="8" fill="url(#sp)"/><path d="M10 22.5 21.5 9.5c1-1.1 2.7.3 1.8 1.5L13.5 24c-.8 1-2.3.9-3-.2-.3-.4-.4-.9-.5-1.3Z" fill="#fff"/></svg>
    Slimepay
  </div>
  <div class="pills">
    <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5 13.5 19 8.5M5 15.5 19 10.5"/></svg>Stellar</span>
    <span class="pill"><span class="dot"></span>Testnet</span>
  </div>
</header>
{{end}}
