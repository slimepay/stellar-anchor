{{define "style"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>
  :root {
    --brand: #005cfd; --brand-dark: #0122af; --brand-soft: rgba(0, 92, 253, .1);
    --bg: #f2f4f8; --card: #ffffff; --ink: #0b1220; --muted: #667085; --line: rgba(15, 23, 42, .08);
    --field: #f3f5f9; --good: #12b76a; --bad: #d92d20; --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #05070d; --card: #0f1420; --ink: #eef2ff; --muted: #94a3b8; --line: rgba(148, 163, 184, .14); --field: #161c2b; --brand-soft: rgba(0, 92, 253, .2); }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  main { max-width: 460px; margin: 0 auto; padding: 16px 16px 120px; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 2px 16px; }
  .brand { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 21px; letter-spacing: -.05em; color: var(--ink); }
  .brand svg { width: 28px; height: 28px; }
  .brand .w1 { color: var(--brand-dark); }
  .brand .w2 { color: var(--brand); }
  @media (prefers-color-scheme: dark) { .brand .w1 { color: #e8eeff; } }
  .net { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--card); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .net .dot { width: 7px; height: 7px; border-radius: 50%; background: #f79009; box-shadow: 0 0 0 3px rgba(247, 144, 9, .18); }

  .coin { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-size: 13px; font-weight: 800; color: #fff; flex: none; }
  .coin.usdc { background: #2775ca; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .55); }
  .coin.xlm { background: #0f172a; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .4); }

  .kyc { padding: 22px 18px 18px; }
  .kyc-icon { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: var(--brand-soft); color: var(--brand); margin-bottom: 14px; }
  .kyc-icon svg.i { width: 24px; height: 24px; }
  .kyc h1, .head h1 { margin: 0 0 4px; font-size: 21px; line-height: 1.25; letter-spacing: -.02em; }
  .kyc p { margin: 0 0 16px; font-size: 14px; }
  .need-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
  .need { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .need li { display: flex; align-items: center; gap: 10px; font-weight: 500; }
  .need span { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: var(--field); color: var(--brand); }
  .head { padding: 4px 2px 14px; }
  .verified { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; padding: 5px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--good); background: rgba(18, 183, 106, .1); }
  .quote { display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .quote b { color: var(--ink); font-weight: 600; }

  h2 { display: flex; align-items: center; gap: 8px; margin: 22px 4px 8px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  h2 svg.i { color: var(--brand); }
  p { margin: 0 0 12px; color: var(--muted); }
  .card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); padding: 4px 14px; }
  .field { padding: 10px 0; }
  .field + .field { border-top: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
  input, select { width: 100%; height: 44px; padding: 0 12px; font: inherit; font-size: 16px; color: var(--ink); background: var(--field); border: 1px solid transparent; border-radius: 12px; appearance: none; -webkit-appearance: none; transition: border-color .15s, box-shadow .15s; }
  select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 19px, calc(100% - 13px) 19px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
  input:focus, select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(0, 92, 253, .15); }
  .amount { position: relative; }
  .amount input { height: 56px; font-size: 26px; font-weight: 700; letter-spacing: -.02em; padding-right: 100px; }
  .amount .unit { position: absolute; right: 10px; bottom: 21px; display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 5px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-weight: 700; font-size: 13px; }
  .amount .unit .coin { width: 20px; height: 20px; font-size: 11px; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 6px 4px 0; }
  .error { display: flex; gap: 10px; align-items: flex-start; background: rgba(217, 45, 32, .08); color: var(--bad); border: 1px solid rgba(217, 45, 32, .2); padding: 12px 14px; border-radius: 14px; margin: 16px 0 0; font-weight: 500; }
  .error svg.i { margin-top: 2px; }

  .trust { display: grid; gap: 10px; margin: 20px 4px 0; }
  .trust div { display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; color: var(--muted); }
  .trust svg.i { margin-top: 1px; color: var(--brand); }

  .cta { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 60%, transparent); }
  .cta-inner { max-width: 460px; margin: 0 auto; }
  button { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; font: inherit; font-size: 16px; font-weight: 700; color: #fff; border: 0; border-radius: 16px; cursor: pointer; background: var(--brand); box-shadow: 0 12px 24px -14px rgba(0, 92, 253, .8); }
  button:hover { background: #0050e0; }
  button svg.i { width: 18px; height: 18px; }
  .fine { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 8px; }

  .done { text-align: center; padding: 8px 4px 4px; }
  .badge { display: grid; place-items: center; width: 64px; height: 64px; margin: 8px auto 14px; border-radius: 50%; color: #fff; background: var(--brand); box-shadow: 0 16px 30px -16px rgba(0, 92, 253, .9); }
  .badge svg.i { width: 30px; height: 30px; stroke-width: 2.4; }
  .done h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: -.02em; }
  .done p { max-width: 34ch; margin: 0 auto 18px; }
  dl { margin: 0; }
  dl div { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; }
  dl div + div { border-top: 1px solid var(--line); }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 600; text-align: right; }
  .timeline { margin: 20px 4px 0; display: grid; gap: 14px; }
  .timeline > div { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; font-size: 13.5px; }
  .timeline span { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; font-size: 12px; font-weight: 700; background: var(--card); border: 1px solid var(--line); color: var(--muted); }
  .timeline .now span { background: var(--brand); border-color: var(--brand); color: #fff; }
  .timeline p { margin: 3px 0 0; color: var(--ink); }
  .timeline b { display: block; }
  .timeline small { color: var(--muted); }
</style>
{{end}}

{{define "brand"}}
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 100 100" aria-hidden="true"><path fill="#005CFD" fill-rule="evenodd" d="M33.458 93.622l51.489-51.488c4.502-4.502 4.502-11.803 0-16.307-4.502-4.503-11.803-4.503-16.307 0L8.998 85.467l8.057 8.058.098.097.098.098c4.51 4.404 11.738 4.372 16.207-.098z"/><path fill="#0122AF" fill-rule="evenodd" d="M15.554 74.33l50.684-50.683.11-.112.112-.11c5.69-5.574 14.794-5.582 20.496-.027 2.713-4.349 2.252-10.116-1.382-13.985L77.161 1 17.617 60.543l-.097.098-.098.098c-3.622 3.708-4.243 9.25-1.868 13.59v.002z"/></svg>
    <span><span class="w1">Slime</span><span class="w2">pay</span></span>
  </div>
  <span class="net"><span class="dot"></span>Stellar Testnet</span>
</header>
{{end}}
