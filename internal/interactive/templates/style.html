{{define "style"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>
  :root {
    --background: hsl(240 24% 96%); --foreground: hsl(240 6% 10%); --card: #fff;
    --primary: #005cfd; --primary-dark: #0122af; --muted: hsl(240 6% 93%); --muted-foreground: hsl(240 2% 50%);
    --border: hsl(240 3% 85%); --success: hsl(135 59% 42%);
    --amber-bg: #fffbeb; --amber-border: #fde68a; --amber-text: #92400e; --amber-icon: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #000; --foreground: #fff; --card: hsl(240 3% 11%); --muted: hsl(240 3% 18%);
      --muted-foreground: hsl(240 2% 60%); --border: hsl(240 2% 22%); --success: hsl(135 64% 50%);
      --amber-bg: rgba(69, 26, 3, .2); --amber-border: rgba(120, 53, 15, .5); --amber-text: #fde68a; --amber-icon: #fbbf24;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif; color: var(--foreground); background: var(--background); -webkit-font-smoothing: antialiased; }
  main { max-width: 576px; margin: 0 auto; padding: 16px 16px 40px; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  p { margin: 0; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 24px; }
  .brand { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 21px; letter-spacing: -.05em; }
  .brand svg { width: 28px; height: 28px; }
  .brand .w1 { color: var(--primary-dark); }
  .brand .w2 { color: var(--primary); }
  @media (prefers-color-scheme: dark) { .brand .w1 { color: #e8eeff; } }
  .net { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--card); color: var(--muted-foreground); white-space: nowrap; }
  .net .dot { width: 6px; height: 6px; border-radius: 50%; background: #ff9500; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%; height: 44px; padding: 0 16px; font: inherit; font-size: 14px; font-weight: 500; color: #fff; background: var(--primary); border: 0; border-radius: 6px; cursor: pointer; box-shadow: 0 1px 3px rgba(0, 0, 0, .1); white-space: nowrap; }
  .btn:hover { background: color-mix(in srgb, var(--primary) 90%, transparent); }
  .btn.round { border-radius: 12px; font-size: 15px; font-weight: 600; }

  .kyc { display: flex; flex-direction: column; align-items: center; padding: 8px 24px 0; text-align: center; }
  .hero-icon { display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 50%; background: color-mix(in srgb, var(--primary) 10%, transparent); color: var(--primary); }
  .hero-icon.red { background: rgba(255, 59, 48, .1); color: #ff3b30; }
  .hero-icon svg.i { width: 28px; height: 28px; stroke-width: 1.8; }
  .kyc h2 { margin: 16px 0 0; font-size: 22px; font-weight: 700; line-height: 28px; }
  .kyc .body { margin-top: 6px; max-width: 36ch; font-size: 15px; line-height: 20px; color: var(--muted-foreground); }
  .kyc form { width: 100%; max-width: 320px; margin-top: 20px; }
  .kyc .note { margin-top: 10px; font-size: 12px; line-height: 16px; color: var(--muted-foreground); }

  .inset { margin-top: 24px; }
  .inset h3 { margin: 0 0 6px; padding: 0 16px; font-size: 12px; font-weight: 500; line-height: 16px; letter-spacing: .02em; text-transform: uppercase; color: var(--muted-foreground); }
  .inset .group { overflow: hidden; border-radius: 12px; background: var(--card); }
  .inset .foot { margin: 6px 0 0; padding: 0 16px; font-size: 12px; line-height: 16px; color: var(--muted-foreground); }
  .row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 10px 16px; }
  .row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: var(--inset, 16px); height: 1px; transform: scaleY(.5); background: var(--border); }
  .row.icon { --inset: 52px; }
  .tile { display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 6px; color: #fff; flex: none; }
  .tile svg.i { width: 15px; height: 15px; stroke-width: 2.2; }
  .tile.gray { background: #8e8e93; } .tile.green { background: #34c759; } .tile.blue { background: #007aff; } .tile.orange { background: #ff9500; }
  .row .title { flex: 1; min-width: 0; font-size: 15px; line-height: 20px; }
  .row label { width: 120px; flex: none; font-size: 15px; line-height: 20px; }
  .row input, .row select { flex: 1; min-width: 0; height: 24px; padding: 0; font: inherit; font-size: 15px; text-align: right; color: var(--foreground); background: transparent; border: 0; outline: none; appearance: none; -webkit-appearance: none; }
  .row input::placeholder { color: var(--muted-foreground); opacity: .7; }
  .row select { direction: rtl; cursor: pointer; }

  .error { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; padding: 12px 16px; border-radius: 12px; font-size: 14px; color: #ff3b30; background: rgba(255, 59, 48, .08); }
  .error svg.i { margin-top: 2px; }
  .actions { margin-top: 24px; }

  .deposit { overflow: hidden; border: 1px solid var(--border); border-radius: 16px; background: var(--card); box-shadow: 0 1px 2px rgba(0, 0, 0, .05); }
  .coin-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--muted) 30%, transparent); }
  .coin-head .who { display: flex; align-items: center; gap: 12px; }
  .coin-img { position: relative; flex: none; }
  .coin-img > svg { display: block; width: 48px; height: 48px; border-radius: 12px; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
  .coin-img .ok { position: absolute; right: -4px; bottom: -4px; display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--card); background: #22c55e; color: #fff; }
  .coin-img .ok svg.i { width: 12px; height: 12px; stroke-width: 3; }
  .coin-head h2 { margin: 0; font-size: 20px; font-weight: 700; line-height: 28px; }
  .coin-head .sub { font-size: 14px; color: var(--muted-foreground); }
  .coin-head .sub b { font-weight: 600; color: var(--foreground); }
  .coin-head .rate { text-align: right; }
  .coin-head .rate .k { font-size: 12px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-foreground); }
  .coin-head .rate .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .content { display: grid; gap: 16px; padding: 20px 24px 24px; }
  .warn { display: flex; gap: 12px; padding: 16px; border: 1px solid var(--amber-border); border-radius: 12px; background: var(--amber-bg); }
  .warn svg.i { margin-top: 1px; color: var(--amber-icon); }
  .warn p { font-size: 12px; line-height: 16px; color: var(--amber-text); }
  .fl { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; }
  .fx { position: relative; }
  .fx input, .fx select { width: 100%; padding: 12px 64px 12px 16px; font: inherit; font-size: 14px; font-weight: 600; color: var(--foreground); background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 1px 2px rgba(0, 0, 0, .05); outline: none; appearance: none; -webkit-appearance: none; }
  .fx input:focus, .fx select:focus { border-color: color-mix(in srgb, var(--primary) 50%, transparent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 20%, transparent); }
  .fx input[readonly] { background: color-mix(in srgb, var(--muted) 40%, transparent); }
  .fx .unit { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 600; color: var(--muted-foreground); pointer-events: none; }
  .fx select { padding-right: 40px; }
  .fx .caret { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted-foreground); pointer-events: none; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .verified { display: inline-flex; align-items: center; gap: 4px; margin-top: 2px; font-size: 13px; font-weight: 500; color: var(--success); }
  .verified svg.i { width: 14px; height: 14px; }
  .fine { margin-top: 12px; text-align: center; font-size: 12px; color: var(--muted-foreground); }

  .done { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 8px; }
  .done .badge { display: flex; align-items: center; justify-content: center; padding: 12px; border-radius: 50%; background: #dcfce7; color: #16a34a; }
  .done .badge.red { background: #fee2e2; color: #dc2626; }
  @media (prefers-color-scheme: dark) { .done .badge { background: rgba(20, 83, 45, .3); color: #4ade80; } .done .badge.red { background: rgba(127, 29, 29, .3); color: #f87171; } }
  .done .badge svg.i { width: 48px; height: 48px; }
  .done h1 { margin: 24px 0 0; font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
  .done .msg { margin-top: 8px; max-width: 40ch; color: var(--muted-foreground); }
  .summary { width: 100%; margin: 24px 0 0; padding: 4px 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); box-shadow: 0 1px 2px rgba(0, 0, 0, .05); text-align: left; }
  .summary div { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; }
  .summary div + div { border-top: 1px solid var(--border); }
  .summary dt { font-size: 14px; color: var(--muted-foreground); }
  .summary dd { margin: 0; font-weight: 500; }
</style>
{{end}}

{{define "brand"}}
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 100 100" aria-hidden="true"><path fill="#005CFD" fill-rule="evenodd" d="M33.458 93.622l51.489-51.488c4.502-4.502 4.502-11.803 0-16.307-4.502-4.503-11.803-4.503-16.307 0L8.998 85.467l8.057 8.058.098.097.098.098c4.51 4.404 11.738 4.372 16.207-.098z"/><path fill="#0122AF" fill-rule="evenodd" d="M15.554 74.33l50.684-50.683.11-.112.112-.11c5.69-5.574 14.794-5.582 20.496-.027 2.713-4.349 2.252-10.116-1.382-13.985L77.161 1 17.617 60.543l-.097.098-.098.098c-3.622 3.708-4.243 9.25-1.868 13.59v.002z"/></svg>
    <span><span class="w1">Slime</span><span class="w2">pay</span></span>
  </div>
  <span class="net"><span class="dot"></span>Stellar Testnet</span>
</header>
{{end}}

{{define "alert"}}{{if .}}<div class="error" role="alert"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg><span>{{.}}</span></div>{{end}}{{end}}
